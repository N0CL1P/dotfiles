font_family      JetBrainsMono Nerd Font
font_size 14.0
cursor_shape beam
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 0
cursor_trail 1
cursor_trail_decay 0.1 0.37
cursor_trail_start_threshold 4
repaint_delay 6
input_delay 1
sync_to_monitor yes
enable_audio_bell no
window_margin_width 8
single_window_margin_width 0
tab_bar_style powerline
dynamic_background_opacity yes
background_opacity 0.69
background_blur 10

# doom-xcode color scheme for Kitty terminal
# Based on doom-xcode (ported by @kadenbarlow) — Apple's Xcode Dark theme
# Original: https://github.com/doomemacs/themes

# ── Basic colors ──────────────────────────────────────────────────────────────
foreground              #ffffff
background              #292a30
selection_foreground    #ffffff
selection_background    #2f6490

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor                  #ffffff
cursor_text_color       #292a30

# ── URL underline ─────────────────────────────────────────────────────────────
url_color               #5dd8ff

# ── Window border ─────────────────────────────────────────────────────────────
active_border_color     #5dd8ff
inactive_border_color   #3d3e43
bell_border_color       #ffa14f

# ── Tab bar ───────────────────────────────────────────────────────────────────
active_tab_foreground   #ffffff
active_tab_background   #3d3e43
inactive_tab_foreground #7f8c98
inactive_tab_background #1f2024
tab_bar_background      #1f2024

# ── Marks ─────────────────────────────────────────────────────────────────────
mark1_foreground        #292a30
mark1_background        #5dd8ff
mark2_foreground        #292a30
mark2_background        #78c2b3
mark3_foreground        #292a30
mark3_background        #dabaff

# ── 16 ANSI colors ────────────────────────────────────────────────────────────
# black
color0  #1f2024
color8  #3d3e43

# red
color1  #ff8170
color9  #ff8170

# green
color2  #78c2b3
color10 #acf2e4

# yellow
color3  #ffa14f
color11 #ffd173

# blue
color4  #4eb0cc
color12 #5dd8ff

# magenta / purple
color5  #ff7ab2
color13 #dabaff

# cyan
color6  #b281eb
color14 #5dd8ff

# white
color7  #ffffff
color15 #ffffff