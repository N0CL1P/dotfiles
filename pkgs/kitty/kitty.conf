font_family      JetBrainsMono Nerd Font
font_size 14.0
cursor_shape beam
cursor_blink_interval 0.6 ease-in-out
cursor_stop_blinking_after 0
cursor_trail 1
cursor_trail_decay 0.1 0.37
cursor_trail_start_threshold 4
repaint_delay 6
input_delay 1
sync_to_monitor yes
enable_audio_bell no
window_margin_width 8
single_window_margin_width 0
tab_bar_style powerline
dynamic_background_opacity yes
background_opacity 0.69
background_blur 10

# JetBrains New UI Dark color scheme for Kitty terminal
# Based on the official JetBrains New UI Dark theme (2022+)
# UI background: #1e1f22, editor: #1e1f22, panels: #2b2d30

# ── Basic colors ──────────────────────────────────────────────────────────────
foreground              #dfe1e5
background              #1e1f22
selection_foreground    #dfe1e5
selection_background    #2e436e

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor                  #dfe1e5
cursor_text_color       #1e1f22

# ── URL underline ─────────────────────────────────────────────────────────────
url_color               #3574f0

# ── Window border ─────────────────────────────────────────────────────────────
active_border_color     #3574f0
inactive_border_color   #393b40
bell_border_color       #f0a732

# ── Tab bar ───────────────────────────────────────────────────────────────────
active_tab_foreground   #dfe1e5
active_tab_background   #1e1f22
inactive_tab_foreground #6f7074
inactive_tab_background #2b2d30
tab_bar_background      #1e1f22

# ── Marks ─────────────────────────────────────────────────────────────────────
mark1_foreground        #1e1f22
mark1_background        #3574f0
mark2_foreground        #1e1f22
mark2_background        #369650
mark3_foreground        #1e1f22
mark3_background        #cf8b23

# ── 16 ANSI colors ────────────────────────────────────────────────────────────
# black
color0  #1e1f22
color8  #4e5157

# red
color1  #f75464
color9  #f75464

# green
color2  #369650
color10 #57965c

# yellow
color3  #cf8b23
color11 #f0a732

# blue
color4  #3574f0
color12 #548af7

# magenta / purple
color5  #b05af4
color13 #c77dff

# cyan
color6  #2fb5c6
color14 #54b4c2

# white
color7  #dfe1e5
color15 #ffffff
