[bar]
order = "default"

    [bar.default]
    center = [ "clock", "media" ]
    concave_edge_corners = false
    end = [ "tray", "notifications", "clipboard", "bluetooth", "volume", "battery", "session" ]
    margin_ends = 0
    radius = 0
    shadow = false
    start = [ "workspaces" ]
    thickness = 20

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[dock]
shadow = false

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true
fingerprint = false
transition = [ "fade" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@winit", "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 810.0
    cx = 476.0
    cy = 866.0
    output = "winit"
    placement_height = 1048.0
    placement_width = 951.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd.kinds]
keyboard_layout = false
lock_keys = false
media = false

[shell]
popup_shadows = false

    [shell.panel]
    shadow = false

[theme]
community_palette = "Breeze"
custom_palette = "wallhaven-6oeexx-mo"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "qt" ]

[wallpaper]
directory = "/home/mollan/dotfiles/wallpapers"
enabled = true
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/mollan/dotfiles/wallpapers/wallhaven-6deqk7.jpg"

    [wallpaper.last]
    path = "/home/mollan/dotfiles/wallpapers/wallhaven-6deqk7.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/mollan/dotfiles/wallpapers/wallhaven-6deqk7.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/mollan/dotfiles/wallpapers/wallhaven-6deqk7.jpg"

[widget.tray]
drawer = true
