[main]
anchor=center
dpi-aware=no
font=JetBrainsMono Nerd Font:size=12
fields=filename,name,keywords,comment,categories,generic,exec
icons-enabled=true
image-size-ratio=0.5
inner-pad=10
layer=overlay
lines=10
tabs=8
horizontal-pad=10
vertical-pad=8
width=25

[border]
radius=0
width=2

[colors]
background=1e1e1eff
border=3c3c3cff
match=569cd6ff
selection=264f78ff
selection-match=4fc1ffff
selection-text=d4d4d4ff
text=d4d4d4ff

[dmenu]
mode=text

[key-bindings]
cancel=Escape Control+c Control+g
cursor-end=End Control+e
cursor-home=Home Control+a
cursor-left=Left Control+b
cursor-right=Right Control+f
delete-next=Delete
delete-prev=BackSpace
execute=Return KP_Enter Control+y
execute-or-next=Tab
next=Down Control+n
prev=Up Control+p
